<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Acteurs d’un marché organisé</title>
  <desc id="desc">Au marché primaire, l’émetteur crée des titres, transmis via un intermédiaire sur le marché organisé aux investisseurs, et reçoit les fonds souscrits. Au marché secondaire, deux investisseurs échangent des titres par l’intermédiaire et la plateforme; l’émetteur ne reçoit pas le paiement de la revente.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#091321"/></linearGradient>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d5a94e"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#54c5e8"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#e8edf5}
      .title{font-size:17px;font-weight:800;letter-spacing:2px;fill:#d5b76e}
      .label{font-size:15px;font-weight:750}
      .sub{font-size:12px;fill:#b1c0d0}
      .node{fill:url(#panel);stroke:#42546b;stroke-width:1.4}
      .venue{fill:#0b1a2b;stroke:#54c5e8;stroke-width:1.2}
      .funds{font-size:11px;font-weight:700;fill:#d8c38e}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="468" rx="18" fill="#060d17" stroke="#27374b"/>
  <text class="title" x="28" y="34">01 · MARCHÉ PRIMAIRE — L’ÉMETTEUR LÈVE DES FONDS</text>
  <rect class="node" x="28" y="60" width="250" height="112" rx="12"/>
  <text class="label" x="153" y="103" text-anchor="middle">Émetteur</text>
  <text class="sub" x="153" y="128" text-anchor="middle">Entreprise ou État</text>
  <rect class="node" x="374" y="60" width="250" height="112" rx="12"/>
  <text class="label" x="499" y="103" text-anchor="middle">Intermédiaire agréé</text>
  <text class="sub" x="499" y="128" text-anchor="middle">SGI : reçoit et transmet les ordres</text>
  <rect class="node" x="720" y="60" width="250" height="112" rx="12"/>
  <text class="label" x="845" y="103" text-anchor="middle">Investisseurs</text>
  <text class="sub" x="845" y="128" text-anchor="middle">Souscrivent aux titres émis</text>
  <path d="M278 101H365" fill="none" stroke="#d5a94e" stroke-width="2.2" marker-end="url(#arrow-gold)"/>
  <path d="M624 101H711" fill="none" stroke="#54c5e8" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <text class="sub" x="321" y="87" text-anchor="middle">titres</text>
  <text class="sub" x="667" y="87" text-anchor="middle">souscription</text>
  <rect class="venue" x="300" y="188" width="400" height="45" rx="22"/>
  <text class="label" x="500" y="216" text-anchor="middle">BRVM · lieu organisé de cotation</text>
  <path d="M845 174V194H710" fill="none" stroke="#54c5e8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-cyan)"/>
  <path d="M300 211H165V174" fill="none" stroke="#d5a94e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-gold)"/>
  <text class="funds" x="28" y="252">Les fonds souscrits reviennent à l’émetteur (selon les modalités de l’opération).</text>
  <path d="M28 270H972" stroke="#27374b"/>
  <text class="title" x="28" y="303">02 · MARCHÉ SECONDAIRE — LES TITRES CIRCULENT</text>
  <rect class="node" x="28" y="326" width="250" height="102" rx="12"/>
  <text class="label" x="153" y="366" text-anchor="middle">Investisseur A</text>
  <text class="sub" x="153" y="390" text-anchor="middle">Cède un titre déjà émis</text>
  <rect class="venue" x="374" y="326" width="250" height="102" rx="12"/>
  <text class="label" x="499" y="366" text-anchor="middle">SGI + BRVM</text>
  <text class="sub" x="499" y="390" text-anchor="middle">Ordre et échange encadrés</text>
  <rect class="node" x="720" y="326" width="250" height="102" rx="12"/>
  <text class="label" x="845" y="366" text-anchor="middle">Investisseur B</text>
  <text class="sub" x="845" y="390" text-anchor="middle">Acquiert le titre</text>
  <path d="M278 364H365" fill="none" stroke="#54c5e8" stroke-width="2.2" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <path d="M624 364H711" fill="none" stroke="#54c5e8" stroke-width="2.2" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
  <text class="funds" x="500" y="452" text-anchor="middle">Le paiement de la revente va au vendeur, pas à l’émetteur.</text>
</svg>
