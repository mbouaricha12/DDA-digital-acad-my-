name: Supabase RLS audit

on:
  push:
    branches:
      - '**'
    paths:
      - 'bff/supabase/**/*.sql'
      - 'supabase/migrations/**/*.sql'
      - 'scripts/audit_rls_policies.js'
      - 'scripts/remote_rls_audit.sql'
      - '.github/workflows/rls-audit.yml'
  pull_request:
    paths:
      - 'bff/supabase/**/*.sql'
      - 'supabase/migrations/**/*.sql'
      - 'scripts/audit_rls_policies.js'
      - 'scripts/remote_rls_audit.sql'
      - '.github/workflows/rls-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-audit:
    name: Static RLS audit (no database credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static RLS audit
        run: |
          node tests/test_rls_policy_audit.js
          node scripts/audit_rls_policies.js

      # Deliberately no SUPABASE_DB_URL or psql step here. A remote query must be
      # run from a separately approved maintenance environment using a protected,
      # environment-scoped credential; PR-controlled SQL must never receive it.
