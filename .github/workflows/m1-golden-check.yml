name: M1 Golden Lesson Check

on:
  pull_request:
    paths:
      - 'dist/m1-1-lesson.js'
      - 'tests/test_m1_golden_lesson.js'
      - 'experiments/m1-1-golden-lesson.html'
      - '.github/workflows/m1-golden-check.yml'
  push:
    branches:
      - 'arena/01a0d22b-dda-digital-acad-my'
    paths:
      - 'dist/m1-1-lesson.js'
      - 'tests/test_m1_golden_lesson.js'
      - 'experiments/m1-1-golden-lesson.html'
      - '.github/workflows/m1-golden-check.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check dist/m1-1-lesson.js
      - name: M1.1 contract tests
        run: node tests/test_m1_golden_lesson.js
