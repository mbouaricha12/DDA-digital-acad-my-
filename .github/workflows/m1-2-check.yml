name: M1.2 Order Execution Check
on:
  pull_request:
    paths:
      - 'dist/m1-2-lesson.js'
      - 'dist/m1-1-lesson.js'
      - 'dist/dda-core.js'
      - 'dist/app.js'
      - 'dist/index.html'
      - 'dist/styles.css'
      - 'tests/test_m1_2_order_execution.js'
      - '.github/workflows/m1-2-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check dist/m1-2-lesson.js
      - run: node --check dist/m1-1-lesson.js
      - run: node --check dist/dda-core.js
      - run: node --check dist/app.js
      - run: node tests/test_m1_2_order_execution.js
